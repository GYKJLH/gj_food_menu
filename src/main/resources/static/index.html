<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>食谱管理</title>
    <link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">
    <script src="https://unpkg.com/vue@2"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script src="https://unpkg.com/element-ui/lib/index.js"></script>
</head>
<body>
<div id="app" style="padding: 40px;">
    <el-card>
        <h2><i class="el-icon-food"></i> 菜谱</h2>
        <!-- 查询条件 -->
        <el-input v-model="filter.name" placeholder="菜名" style="width: 150px; margin-right: 10px;"></el-input>
        <el-input v-model="filter.ingredients" placeholder="食材" style="width: 150px; margin-right: 10px;"></el-input>
        <el-select v-model="filter.cook" placeholder="厨师" style="width: 150px; margin-right: 10px;">
            <el-option label="全部" :value="null"></el-option>
            <el-option label="大郭" :value="'大郭'"></el-option>
            <el-option label="小蒋" :value="'小蒋'"></el-option>
        </el-select>
        <el-select v-model="filter.type" placeholder="荤素" style="width: 120px; margin-right: 10px;">
            <el-option label="全部" :value="null"></el-option>
            <el-option label="荤" :value="1"></el-option>
            <el-option label="素" :value="2"></el-option>
        </el-select>
        <el-button type="primary" @click="loadFoods">查询</el-button>
        <el-button type="danger" @click="randomMenu(1)">随机推荐（荤）</el-button>
        <el-button type="success" @click="randomMenu(2)">随机推荐（素）</el-button>
        <el-button type="primary" @click="openAddDialog()">新增美食</el-button>
        <el-button type="primary" @click="reset()">重置</el-button>

        <el-divider></el-divider>

        <el-divider></el-divider>

        <!-- 食谱表格 -->
        <el-table :data="foods" border style="width: 100%">
            <el-table-column prop="name" label="菜名"></el-table-column>
            <el-table-column prop="introduction" label="简介"></el-table-column>
            <el-table-column prop="ingredients" label="食材"></el-table-column>
            <el-table-column prop="method" label="做法"></el-table-column>
            <el-table-column prop="cook" label="厨师"></el-table-column>
            <el-table-column prop="type" label="荤素">
                <template slot-scope="scope">
                    <span>{{ scope.row.type === 1 ? '荤' : '素' }}</span>
                </template>
            </el-table-column>
            <el-table-column prop="image" label="图片">
                <template #default="scope">
                    <img
                            :src="scope.row.image"
                            alt="图片"
                            style="width: 80px; height: 80px; cursor: pointer;"
                            @click="openPreview(scope.row.image)"
                    />
                </template>
            </el-table-column>
            <el-table-column label="操作">
                <template slot-scope="scope">
                    <el-button size="mini" type="primary" @click="openEditDialog(scope.row)">编辑</el-button>
                </template>
            </el-table-column>
        </el-table>

        <!-- 弹窗预览大图 -->
        <el-dialog :visible.sync="previewVisible" width="50%" :before-close="closePreview">
            <img :src="previewImage" alt="预览图" style="width: 100%;"/>
        </el-dialog>

        <!-- 分页组件 -->
        <el-pagination
                style="margin-top: 20px; text-align: right;"
                background
                layout="prev, pager, next"
                :page-size="filter.pageSize"
                :current-page.sync="filter.page"
                :total="total"
                @current-change="handlePageChange">
        </el-pagination>

    </el-card>

    <!-- 新增对话框 -->
    <el-dialog title="新增菜谱" :visible.sync="addDialogVisible">
        <el-form :model="addFoodData" label-width="60px">
            <el-form-item label="菜名">
                <el-input v-model="addFoodData.name"></el-input>
            </el-form-item>
            <el-form-item label="简介">
                <el-input v-model="addFoodData.introduction"></el-input>
            </el-form-item>
            <el-form-item label="食材">
                <el-input v-model="addFoodData.ingredients"></el-input>
            </el-form-item>
            <el-form-item label="做法">
                <el-input v-model="addFoodData.method"></el-input>
            </el-form-item>
            <el-form-item label="厨师">
                <el-select v-model="addFoodData.cook" placeholder="厨师">
                    <el-option label="大郭" :value="'大郭'"></el-option>
                    <el-option label="小蒋" :value="'小蒋'"></el-option>
                </el-select>
            </el-form-item>
            <el-form-item label="荤素">
                <el-select v-model="addFoodData.type" placeholder="荤素">
                    <el-option label="荤" :value="1"></el-option>
                    <el-option label="素" :value="2"></el-option>
                </el-select>
            </el-form-item>
            <el-form-item>
                <el-upload
                        class="upload-demo"
                        drag
                        action="/menu/upload"
                        :headers="uploadHeaders"
                        :on-success="handleUploadSuccess"
                        name="file"
                        :show-file-list="false"
                >
                    <i class="el-icon-upload"></i>
                    <div class="el-upload__text">将文件拖到此处，或<em>点击上传</em></div>
<!--                    <div class="el-upload__tip" slot="tip">只能上传jpg/png文件，且不超过500kb</div>-->
                </el-upload>
                <!-- 自己渲染 fileList -->
                <div class="custom-file-list" v-if="fileList.length">
                    <div
                            class="file-item"
                            v-for="(file, index) in fileList"
                            :key="file.uid"
                    >
                        <img v-if="file.url" :src="file.url" class="file-thumb"/>
                        <span>{{ file.name }}</span>
                        <i class="el-icon-close" @click="removeFile(index)"></i>
                    </div>
                </div>
            </el-form-item>
        </el-form>
        <span slot="footer" class="dialog-footer">
            <el-button @click="addDialogVisible = false">取消</el-button>
            <el-button type="primary" @click="saveAddFood">保存</el-button>
        </span>
    </el-dialog>

    <!-- 编辑对话框 -->
    <el-dialog title="编辑菜谱" :visible.sync="editDialogVisible">
        <el-form :model="editFoodData" label-width="60px">
            <el-form-item label="菜名">
                <el-input v-model="editFoodData.name"></el-input>
            </el-form-item>
            <el-form-item label="简介">
                <el-input v-model="editFoodData.introduction"></el-input>
            </el-form-item>
            <el-form-item label="食材">
                <el-input v-model="editFoodData.ingredients"></el-input>
            </el-form-item>
            <el-form-item label="做法">
                <el-input v-model="editFoodData.method"></el-input>
            </el-form-item>
            <el-form-item label="厨师">
                <el-select v-model="editFoodData.cook" placeholder="厨师">
                    <el-option label="大郭" :value="'大郭'"></el-option>
                    <el-option label="小蒋" :value="'小蒋'"></el-option>
                </el-select>
            </el-form-item>
            <el-form-item label="荤素">
                <el-select v-model="editFoodData.type" placeholder="荤素">
                    <el-option label="荤" :value="1"></el-option>
                    <el-option label="素" :value="2"></el-option>
                </el-select>
            </el-form-item>
            <el-form-item label="图片">
                <template #default="scope">
                    <img
                            :src="editFoodData.image"
                            alt="图片"
                            style="width: 80px; height: 80px; cursor: pointer;"
                    />
                </template>
            </el-form-item>
            <el-form-item>
                <el-upload
                        class="upload-demo"
                        drag
                        action="/menu/upload"
                        :headers="uploadHeaders"
                        :on-success="uploadEditSuccess"
                        name="file"
                        :show-file-list="false"
                >
                    <i class="el-icon-upload"></i>
                    <div class="el-upload__text">将文件拖到此处，或<em>点击上传</em></div>
<!--                    <div class="el-upload__tip" slot="tip">只能上传jpg/png文件，且不超过500kb</div>-->
                </el-upload>
            </el-form-item>
        </el-form>
        <span slot="footer" class="dialog-footer">
            <el-button @click="editDialogVisible = false">取消</el-button>
            <el-button type="primary" @click="saveEditFood">保存</el-button>
        </span>
    </el-dialog>

</div>

<script>
    // 检查登录状态（必须放在最顶部执行）
    const token = sessionStorage.getItem('token');
    if (!token) {
        window.location.href = '/login.html';
    }
    new Vue({
        el: '#app',
        data: {
            foods: [],
            total: 0,
            filter: {name: '', ingredients: '', cook: null, type: null, page: 1, pageSize: 10},
            addDialogVisible: false,
            addFoodData: {name: '', ingredients: '', introduction: '', method: '', cook: null, type: null, image: null},
            editDialogVisible: false,
            editFoodData: {id: null, name: '', ingredients: '', introduction: '', method: '', cook: null, type: null, image: null},
            uploadHeaders: {
                'Authorization': sessionStorage.getItem("token")
            },
            fileList: [],
            previewVisible: false,
            previewImage: "",

        },
        created() {
            this.loadFoods();
        },
        methods: {
            // 兼容多种后端返回格式来解析列表与总数
            parseListResponse(res) {
                const data = res && res.data ? res.data : res;
                if (!data) return {rows: [], total: 0};

                if (Array.isArray(data)) {
                    return {rows: data, total: data.length};
                }
                // mybatis-plus IPage: { records: [], total: N }
                if (Array.isArray(data.records)) {
                    return {rows: data.records, total: data.total ?? data.records.length};
                }
                // some apis use rows/total
                if (Array.isArray(data.rows)) {
                    return {rows: data.rows, total: data.total ?? data.rows.length};
                }
                // fallback: maybe data itself is a single object or empty
                return {rows: [], total: 0};
            },

            // 查询
            loadFoods() {
                axios.get('/menu/list', {
                    params: this.filter,
                    headers: {
                        'Authorization': sessionStorage.getItem("token"),
                        'Content-Type': 'application/json'
                    }
                })
                    .then(res => {
                        this.foods = res.data.data.rows;
                        this.total = res.data.data.total;
                    })
                    .catch(err => {
                        const msg = err.response?.data?.message || '加载列表失败';
                        this.$message.error(msg);
                    });
            },

            // 打开新增弹窗并重置表单
            openAddDialog() {
                this.addFoodData = {name: '', ingredients: '', method: '', cook: null, type: null, url: null};
                this.addDialogVisible = true;
            },

            // 新增保存
            saveAddFood() {
                // 简单校验
                if (!this.addFoodData.name || this.addFoodData.name.trim() === '') {
                    this.$message.error('菜名不能为空');
                    return;
                }

                axios.post('/menu/add', this.addFoodData, {
                    headers: {
                        'Authorization': sessionStorage.getItem("token"),
                        'Content-Type': 'application/json'
                    }
                })
                    .then(res => {
                        if (res.data.code === 200) {
                            this.$message.success("添加成功");
                            this.addDialogVisible = false;
                            this.fileList = [];
                            this.loadFoods();
                        } else {
                            this.$message.error(res.data.message);
                        }

                    })
                    .catch(err => {
                        const msg = err.response?.data?.message || '添加失败';
                        this.$message.error(msg);
                    });
            },

            // 打开编辑弹窗（复制数据到 editFoodData）
            openEditDialog(food) {
                this.editFoodData = Object.assign({}, food);
                this.editDialogVisible = true;
            },

            // 编辑保存
            saveEditFood() {
                if (!this.editFoodData.name || this.editFoodData.name.trim() === '') {
                    this.$message.error('菜名不能为空');
                    return;
                }
                axios.post('/menu/edit', this.editFoodData, {
                    headers: {
                        'Authorization': sessionStorage.getItem("token"),
                        'Content-Type': 'application/json'
                    }
                })
                    .then(res => {
                        if (res.data.code === 200) {
                            this.$message.success("修改成功");
                            this.editDialogVisible = false;
                            this.loadFoods();
                        } else {
                            this.$message.error(res.data.message);
                        }
                    })
                    .catch(err => {
                        console.error('修改失败', err);
                        const msg = err.response?.data?.message || '修改失败';
                        this.$message.error(msg);
                    });
            },

            // 随机推荐
            randomMenu(type) {
                axios.get('/menu/random', {
                    params: {type: type},
                    headers: {
                        'Authorization': sessionStorage.getItem("token"),
                        'Content-Type': 'application/json'
                    }
                })
                    .then(res => {
                        if (res.data.code === 200) {
                            this.$alert(`今日推荐：${res.data.data.name}`, '随机菜单');
                        } else {
                            this.$message.info("暂无食谱数据");
                        }
                    })
                    .catch(err => {
                        console.error('随机推荐失败', err);
                        const msg = err.response?.data?.message || '请求失败';
                        this.$message.error(msg);
                    });
            },

            // 分页切换
            handlePageChange(newPage) {
                this.filter.page = newPage;
                this.loadFoods();
            },

            onChange(file, fileList) {
                this.fileList = fileList
            },

            handleUploadSuccess(res, file) {
                if (res.code === 200) {
                    this.addFoodData.image = res.data;
                    // 将文件添加到自定义列表
                    this.fileList.push({
                        uid: file.uid,
                        name: file.name,
                        url: res.data, // 服务端返回的图片 URL
                    });
                    this.$message.success("图片上传成功");
                } else {
                    this.$message.error(res.message || "上传失败");
                    console.log(this.fileList)
                    // 移除失败文件
                    const index = this.fileList.findIndex(f => f.uid === file.uid);
                    if (index !== -1) {
                        this.fileList.splice(index, 1);
                    }
                }
            },
            removeFile(index) {
                this.fileList.splice(index, 1);
                // 如果你想清空 addFoodData.image
                if (this.fileList.length === 0) {
                    this.addFoodData.image = null;
                }
            },
            openPreview(url) {
                this.previewImage = url;
                this.previewVisible = true;
            },
            closePreview() {
                this.previewVisible = false;
                this.previewImage = "";
            },
            uploadEditSuccess(res) {
                if (res.code === 200) {
                    this.editFoodData.image = res.data;
                    this.$message.success("图片上传成功");
                } else {
                    this.$message.error(res.message || "上传失败");
                }
            },
            reset() {
                this.filter.name = ''
                this.filter.ingredients = ''
                this.filter.cook = null
                this.filter.type = null
                this.filter.page = 1
                this.filter.pageSize = 10
                this.loadFoods()
            }
        }
    });
</script>
</body>
<style scoped>
    .custom-file-list {
        display: flex;
        flex-wrap: wrap;
        gap: 10px; /* 文件间距 */
    }

    .file-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100px; /* 每个文件容器宽度 */
    }

    .file-thumb {
        width: 80px; /* 缩略图宽度 */
        height: 80px; /* 缩略图高度 */
        object-fit: cover; /* 保持比例裁剪 */
        border-radius: 4px;
        margin-bottom: 5px;
    }
</style>

</html>
