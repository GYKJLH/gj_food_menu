<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <title>系统登录</title>
    <link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">
    <style>
        body {
            background: linear-gradient(135deg, #a8edea, #fed6e3);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            font-family: "Microsoft YaHei", sans-serif;
        }
        .login-container {
            width: 400px;
            padding: 40px 40px 20px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }
        .login-title {
            text-align: center;
            font-size: 22px;
            margin-bottom: 30px;
            color: #333;
            font-weight: bold;
        }
        .login-footer {
            text-align: center;
            margin-top: 20px;
            color: #888;
            font-size: 13px;
        }
    </style>
</head>
<body>
<div id="app">
    <div class="login-container">
        <div class="login-title">
            <el-icon><User /></el-icon> 系统登录
        </div>

        <el-form :model="form" :rules="rules" ref="form" label-width="0">
            <el-form-item prop="username">
                <el-input v-model="form.username" prefix-icon="el-icon-user" placeholder="请输入用户名"></el-input>
            </el-form-item>

            <el-form-item prop="password">
                <el-input v-model="form.password" type="password" prefix-icon="el-icon-lock" placeholder="请输入密码"></el-input>
            </el-form-item>

            <el-form-item>
                <el-button type="primary" style="width: 100%" @click="login">登录</el-button>
            </el-form-item>
        </el-form>

        <div class="login-footer">果酱夫妇的美食菜单</div>
    </div>
</div>

<script src="https://unpkg.com/vue@2/dist/vue.js"></script>
<script src="https://unpkg.com/element-ui/lib/index.js"></script>
<script src="https://unpkg.com/axios/dist/axios.min.js"></script>

<script>
    new Vue({
        el: "#app",
        data() {
            return {
                form: {
                    username: "",
                    password: "",
                },
                rules: {
                    username: [{ required: true, message: "请输入用户名", trigger: "blur" }],
                    password: [{ required: true, message: "请输入密码", trigger: "blur" }],
                },
            };
        },
        methods: {
            async login() {
                this.$refs.form.validate(async valid => {
                    if (!valid) return;
                    try {
                        console.log(this.form)
                        const res = await axios.post("/noToken/login", this.form);
                        if (res.status === 200) {
                            console.log(res.data)
                            this.$message.success("登录成功");
                            sessionStorage.setItem("token", res.data.token); // 假设后端返回 token
                            window.location.href = "/index.html"; // 登录成功跳转主页面
                        }
                    } catch (e) {
                        this.$message.error(e.response?.data?.message || "用户名或密码错误");
                    }
                });
            },
        },
    });
</script>
</body>
</html>
