<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>移动端点餐</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Element UI -->
    <link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">

    <!-- Vue / axios / Element UI JS -->
    <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://unpkg.com/element-ui/lib/index.js"></script>

</head>
<body>

<div id="app">

    <!-- 顶部 -->
    <div class="header">
        <div>点餐</div>
    </div>

    <!-- 菜品 -->
    <div class="menu-list">
        <div class="menu-card" v-for="item in foods" :key="item.id">
            <div class="menu-row">
                <!-- 左边图片 -->
                <img class="food-img" :src="item.image">

                <!-- 右边内容 -->
                <div class="menu-info">
                    <div class="food-name">{{ item.menuName }}</div>
                    <div class="food-intro">{{ item.introduction }}</div>

                    <div class="menu-footer">
                        <div class="count">
                            <button @click="changeCount(item.id, -1)">−</button>
                            <span>{{ cart[item.id] || 0 }}</span>
                            <button @click="changeCount(item.id, 1)">＋</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 底部固定栏 -->
    <div class="bottom-bar">
        <!-- 左侧 tab -->
        <div class="tab-bar">
            <div
                    class="tab-item"
                    :class="{ active: activeTab === 'menu' }"
                    @click="activeTab = 'menu'">点餐</div>
            <div
                    class="tab-item"
                    :class="{ active: activeTab === 'orders' }"
                    @click="activeTab = 'orders'">订单</div>
            <div
                    class="tab-item"
                    :class="{ active: activeTab === 'mine' }"
                    @click="activeTab = 'mine'">我的</div>
        </div>

        <!-- 中间购物信息 -->
        <div class="cart-info">
            🛒 已选 {{ totalCount }} 份
        </div>

        <!-- 右侧结算按钮 -->
        <el-button type="danger" class="submit-btn" @click="submitOrder">
            去结算
        </el-button>
    </div>


</div>

<script>
    new Vue({
        el: '#app',

        data() {
            return {
                foods: [],
                cart: {},
                activeTab: 'menu'
            }
        },

        computed: {
            totalCount() {
                return Object.values(this.cart).reduce((a, b) => a + b, 0);
            }
        },

        created() {
            this.loadMenu();
        },

        methods: {
            // 查询菜单
            loadMenu() {
                axios.get('/order/listMenu', {
                    headers: {
                        'Authorization': sessionStorage.getItem("token")
                    }
                }).then(res => {
                    console.log(res.data)
                    if (res.data.code === 200) {
                        this.foods = res.data.data
                    } else {
                        this.$message.error(res.data.message)
                    }
                }).catch(err => {
                    this.$message.error(err.response?.data?.message || '加载菜单失败');
                });
            },
            changeCount(itemId, delta) {
                if (!this.cart[itemId]) {
                    this.$set(this.cart, itemId, 0); // Vue.set 保证响应式
                }
                this.cart[itemId] += delta;
                if (this.cart[itemId] < 0) this.cart[itemId] = 0;
            },
            submitOrder() {
                if(this.totalCount === 0){
                    this.$message.warning("请先选择菜品");
                    return;
                }
                const order = Object.keys(this.cart).map(id => ({ menuId:id, count:this.cart[id] }));
                console.log("下单数据:", order);
                this.$message.success("下单成功（模拟）");
                this.cart = {};
            }

        }
    });
</script>

<style>
    body {
        margin: 0;
        background: #f2f3f5;
    }

    .header {
        height: 50px;
        background: #409eff;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 14px;
    }

    .category div {
        padding: 12px 16px;
        white-space: nowrap;
        cursor: pointer;
    }

    .menu-list {
        padding: 10px;
        padding-bottom: 90px;
    }

    .menu-card {
        background: #fff;
        border-radius: 8px;
        margin-bottom: 12px;
        overflow: hidden;
        padding: 10px;
    }

    .menu-row {
        display: flex;
        align-items: flex-start;
    }

    .food-img {
        width: 100px;
        height: 100px;
        object-fit: cover;
        border-radius: 8px;
        margin-right: 12px;
    }

    .menu-info {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        position: relative; /* 保证按钮在可点击层 */
    }

    .food-name {
        font-weight: bold;
        font-size: 16px;
        margin-bottom: 6px;
    }

    .food-intro {
        color: #666;
        font-size: 13px;
        margin-bottom: 10px;
    }

    .menu-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .count button {
        width: 36px;
        height: 36px;
        font-size: 18px;
        border-radius: 50%;
        border: none;
        background: #409eff;
        color: #fff;
    }

    .count span {
        display: inline-block;
        width: 30px;
        text-align: center;
    }

    /* 底部容器 */
    .bottom-bar {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        height: 60px;
        background: #fff;
        border-top: 1px solid #ebeef5;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 10px;
        z-index: 100;
    }

    /* tab 栏 */
    .tab-bar {
        display: flex;
        align-items: center;
        height: 100%;
    }

    .tab-item {
        padding: 0 12px;
        line-height: 60px;
        cursor: pointer;
        color: #666;
    }

    .tab-item.active {
        color: #409eff;
        font-weight: bold;
        border-bottom: 2px solid #409eff;
    }

    /* 中间购物信息 */
    .cart-info {
        font-size: 14px;
    }

    /* 右侧结算按钮 */
    .submit-btn {
        height: 40px;
    }


</style>
</body>
</html>
