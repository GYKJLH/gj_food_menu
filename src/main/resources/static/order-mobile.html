<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>移动端点餐</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Element UI -->
    <link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">

    <!-- Vue / axios / Element UI JS -->
    <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://unpkg.com/element-ui/lib/index.js"></script>

</head>
<body>

<div id="app">

    <!-- 顶部 -->
    <div class="header">
        <div>点餐</div>
    </div>

    <!-- 菜品 -->
    <div class="menu-list">
        <div class="menu-card" v-for="item in foods" :key="item.id">
            <div class="menu-row">
                <!-- 左边图片 -->
                <img class="food-img" :src="item.image">

                <!-- 右边内容 -->
                <div class="menu-info">
                    <div class="food-name">{{ item.menuName }}</div>
                    <div class="food-intro">{{ item.introduction }}</div>

                    <div class="menu-footer">
                        <div class="count">
                            <button @click="changeCount(item.id, -1)">−</button>
                            <span>{{ cart[item.id] || 0 }}</span>
                            <button @click="changeCount(item.id, 1)">＋</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>

<script>
    new Vue({
        el: '#app',

        data() {
            return {
                foods: [],
                cart: {}
            }
        },

        computed: {},

        created() {
            this.loadMenu();
        },

        methods: {
            // 查询菜单
            loadMenu() {
                axios.get('/order/listMenu', {
                    headers: {
                        'Authorization': sessionStorage.getItem("token")
                    }
                }).then(res => {
                    console.log(res.data)
                    if (res.data.code === 200) {
                        this.foods = res.data.data
                    } else {
                        this.$message.error(res.data.message)
                    }
                }).catch(err => {
                    this.$message.error(err.response?.data?.message || '加载菜单失败');
                });
            },
            changeCount(itemId, delta) {
                if (!this.cart[itemId]) {
                    this.$set(this.cart, itemId, 0); // Vue.set 保证响应式
                }
                this.cart[itemId] += delta;
                if (this.cart[itemId] < 0) this.cart[itemId] = 0;
            }

        }
    });
</script>

<style>
    body {
        margin: 0;
        background: #f2f3f5;
    }

    .header {
        height: 50px;
        background: #409eff;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 14px;
    }

    .category div {
        padding: 12px 16px;
        white-space: nowrap;
        cursor: pointer;
    }

    .menu-list {
        padding: 10px;
        padding-bottom: 90px;
    }

    .menu-card {
        background: #fff;
        border-radius: 8px;
        margin-bottom: 12px;
        overflow: hidden;
        padding: 10px;
    }

    .menu-row {
        display: flex;
        align-items: flex-start;
    }

    .food-img {
        width: 100px;
        height: 100px;
        object-fit: cover;
        border-radius: 8px;
        margin-right: 12px;
    }

    .menu-info {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        position: relative; /* 保证按钮在可点击层 */
    }

    .food-name {
        font-weight: bold;
        font-size: 16px;
        margin-bottom: 6px;
    }

    .food-intro {
        color: #666;
        font-size: 13px;
        margin-bottom: 10px;
    }

    .menu-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .count button {
        width: 36px;
        height: 36px;
        font-size: 18px;
        border-radius: 50%;
        border: none;
        background: #409eff;
        color: #fff;
    }

    .count span {
        display: inline-block;
        width: 30px;
        text-align: center;
    }

</style>
</body>
</html>
