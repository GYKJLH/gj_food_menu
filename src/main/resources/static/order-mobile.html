    <!-- 顶部 -->

        <div>点餐</div>
    </div>

    <!-- 菜品 -->
    <div class="order-container">

        <!-- 顶部搜索（只在菜单页显示） -->
        <div class="menu-search" v-if="activeTab === 'menu'">
            <el-input
                    v-model="filterName"
                    placeholder="搜索菜名"
                    clearable
                    prefix-icon="el-icon-search"
                    class="search-input"
            />
        </div>

        <!-- 主内容区 -->
        <div class="menu-content">

            <!-- 左侧分类（仅菜单页显示） -->
            <div class="menu-type" v-if="activeTab === 'menu'">
                <div
                        class="type-item"
                        :class="{ active: activeType === type }"
                        v-for="type in typeList"
                        :key="type"
                        @click="activeType = type"
                >
                    {{ type }}
                </div>
            </div>

            <!-- 右侧内容区 -->
            <div class="menu-right">

                <!-- 菜单页 -->
                <div class="menu-list" v-if="activeTab === 'menu'">
                    <div class="menu-card" v-for="item in filteredFoods" :key="item.id">
                        <div class="menu-row">
                            <img class="food-img" :src="item.image">

                            <div class="menu-info">
                                <div class="food-name">{{ item.menuName }}</div>
                                <div class="food-intro">{{ item.introduction }}</div>

                                <div class="menu-footer">
                                    <div class="count">
                                        <button @click="changeCount(item.id, -1)">−</button>
                                        <span>{{ cart[item.id] || 0 }}</span>
                                        <button @click="changeCount(item.id, 1)">＋</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 订单页 -->
                <div class="order-page" v-if="activeTab === 'orders'">
                    <div class="order-card" v-for="item in orderList" :key="item.id">
                        <div class="order-header">
                            <span class="menu-name">{{ item.menuName }}</span>
                            <span class="menu-count">x{{ item.menuCount }}</span>
                        </div>

                        <div class="order-body">
                            <div class="order-row">
                                <span class="label">下单人</span>
                                <span>{{ item.orderUser }}</span>
                            </div>
                            <div class="order-row">
                                <span class="label">下单时间</span>
                                <span>{{ formatTime(item.orderTime) }}</span>
                            </div>
                        </div>
                    </div>

                    <div v-if="orderList.length === 0" class="empty">
                        暂无订单
                    </div>
                </div>

            </div>
        </div>
    </div>

<script>

    // 检查登录状态（必须放在最顶部执行）
    const token = sessionStorage.getItem('token');
    if (!token) {
        window.location.href = '/order-login.html';
    }

    new Vue({
        el: '#app',

        data() {
            return {
                foods: [],
                cart: {},
                activeTab: 'menu',
                orderList: [],
                addOrder: [],
                filterName: '',
                activeType: '',
            }
        },

        computed: {
            totalCount() {
                return Object.values(this.cart).reduce((a, b) => a + b, 0);
            },
            // filteredFoods() {
            //     if (!this.filterName) return this.foods
            //     return this.foods.filter(item =>
            //         item.menuName.includes(this.filterName)
            //     )
            // },
            typeList() {
                return [...new Set(this.foods.map(item => item.menuType))];
            },
            filteredFoods() {
                return this.foods
                    .filter(item => {
                        // 分类过滤
                        return !this.activeType || item.menuType === this.activeType;
                    })
                    .filter(item => {
                        // 搜索过滤
                        return !this.filterName ||
                            item.menuName.includes(this.filterName);
                    });
            }
        },
        watch: {
            filterName(val) {
                // 清空搜索，不自动切换
                if (!val) return;

                // 在所有菜品中查找第一个匹配
                const match = this.foods.find(item =>
                    item.menuName.includes(val)
                );

                // 找到就切换分类
                if (match) {
                    this.activeType = match.menuType;
                }
            }
        },

        created() {
            this.loadMenu();
        },

        methods: {
            // 查询菜单
            loadMenu() {
                axios.get('/order/listMenu', {
                    headers: {
                        'Authorization': sessionStorage.getItem("token")
                    }
                }).then(res => {
                    if (res.data.code === 200) {
                        this.foods = res.data.data
                        // 默认选中第一个 type
                        if (this.foods.length) {
                            this.activeType = this.foods[0].menuType;
                        }
                    } else {
                        this.$message.error(res.data.message)
                    }
                }).catch(err => {
                    this.$message.error(err.response?.data?.message || '加载菜单失败');
                });
            },
            changeCount(itemId, delta) {
                if (!this.cart[itemId]) {
                    this.$set(this.cart, itemId, 0); // Vue.set 保证响应式
                }
                this.cart[itemId] += delta;
                if (this.cart[itemId] < 0) this.cart[itemId] = 0;
            },
            submitOrder() {
                if (this.totalCount === 0) {
                    this.$message.warning("请先选择菜品");
                    return;
                }
                this.addOrder = Object.keys(this.cart).map(id => ({menuId: id, count: this.cart[id]}));
                axios.post('/order/add', this.addOrder, {
                    headers: {
                        'Authorization': sessionStorage.getItem("token")
                    }
                }).then(res => {
                    if (res.data.code === 200) {
                        this.cart = {}
                        this.addOrder = {}
                    } else {
                        this.$message.error(res.data.message)
                    }
                }).catch(err => {
                    this.$message.error(err.response?.data?.message || '加载菜单失败');
                });
            },
            loadOrderList() {
                this.activeTab = 'orders'
                axios.get('/order/list', {
                    headers: {
                        'Authorization': sessionStorage.getItem("token")
                    }
                }).then(res => {
                    if (res.data.code === 200) {
                        this.orderList = res.data.data
                    } else {
                        this.$message.error(res.data.message)
                    }
                }).catch(err => {
                    this.$message.error(err.response?.data?.message || '加载订单失败');
                });
            },
            formatTime(time) {
                return time ? time.replace('T', ' ') : '';
            }

        }
    });
</script>
