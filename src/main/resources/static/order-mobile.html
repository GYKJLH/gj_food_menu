<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>点餐</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Element UI -->
    <link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">

    <!-- Vue / axios / Element UI JS -->
    <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://unpkg.com/element-ui/lib/index.js"></script>

</head>
<body>

<div id="app">

    <!-- 顶部 -->
    <div class="header">
        <div>点餐</div>
    </div>

    <!-- 菜品 -->
    <!-- 菜品（点餐页） -->
    <div class="menu-list" v-if="activeTab === 'menu'">
        <div class="menu-search">
            <el-input
                    v-model="filterName"
                    placeholder="搜索菜名"
                    clearable
                    prefix-icon="el-icon-search"
                    class="search-input"
            />
        </div>
        <div class="menu-card" v-for="item in filteredFoods" :key="item.id">
            <div class="menu-row">
                <img class="food-img" :src="item.image">

                <div class="menu-info">
                    <div class="food-name">{{ item.menuName }}</div>
                    <div class="food-intro">{{ item.introduction }}</div>

                    <div class="menu-footer">
                        <div class="count">
                            <button @click="changeCount(item.id, -1)">−</button>
                            <span>{{ cart[item.id] || 0 }}</span>
                            <button @click="changeCount(item.id, 1)">＋</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 订单页 -->
    <div class="order-page" v-if="activeTab === 'orders'">

        <div class="order-card" v-for="item in orderList" :key="item.id">
            <div class="order-header">
                <span class="menu-name">{{ item.menuName }}</span>
                <span class="menu-count">x{{ item.menuCount }}</span>
            </div>

            <div class="order-body">
                <div class="order-row">
                    <span class="label">下单人</span>
                    <span>{{ item.orderUser }}</span>
                </div>
                <div class="order-row">
                    <span class="label">下单时间</span>
                    <span>{{ formatTime(item.orderTime) }}</span>
                </div>
            </div>
        </div>

        <div v-if="orderList.length === 0" class="empty">
            暂无订单
        </div>

    </div>


    <!-- 底部固定栏 -->
    <div class="bottom-bar">

        <!-- 左侧 tab -->
        <div class="tab-bar">
            <div
                    class="tab-item"
                    :class="{ active: activeTab === 'menu' }"
                    @click="activeTab = 'menu'">
                点餐
            </div>
            <div
                    class="tab-item"
                    :class="{ active: activeTab === 'orders' }"
                    @click="loadOrderList">
                订单
            </div>
        </div>

        <!-- 中间购物信息（只在点餐页显示） -->
        <div class="cart-info" v-if="activeTab === 'menu'">
            🛒 已选 {{ totalCount }} 份
        </div>

        <!-- 右侧结算按钮（只在点餐页显示） -->
        <el-button
                v-if="activeTab === 'menu'"
                type="danger"
                class="submit-btn"
                @click="submitOrder">
            去结算
        </el-button>

    </div>


</div>

<script>

    // 检查登录状态（必须放在最顶部执行）
    const token = sessionStorage.getItem('token');
    console.log(token)
    if (!token) {
        window.location.href = '/order-login.html';
    }

    new Vue({
        el: '#app',

        data() {
            return {
                foods: [],
                cart: {},
                activeTab: 'menu',
                orderList: [],
                addOrder: [],
                filterName: ''
            }
        },

        computed: {
            totalCount() {
                return Object.values(this.cart).reduce((a, b) => a + b, 0);
            },
            filteredFoods() {
                if (!this.filterName) return this.foods
                return this.foods.filter(item =>
                    item.menuName.includes(this.filterName)
                )
            }
        },

        created() {
            this.loadMenu();
        },

        methods: {
            // 查询菜单
            loadMenu() {
                axios.get('/order/listMenu', {
                    headers: {
                        'Authorization': sessionStorage.getItem("token")
                    }
                }).then(res => {
                    console.log(res.data)
                    if (res.data.code === 200) {
                        this.foods = res.data.data
                    } else {
                        this.$message.error(res.data.message)
                    }
                }).catch(err => {
                    this.$message.error(err.response?.data?.message || '加载菜单失败');
                });
            },
            changeCount(itemId, delta) {
                if (!this.cart[itemId]) {
                    this.$set(this.cart, itemId, 0); // Vue.set 保证响应式
                }
                this.cart[itemId] += delta;
                if (this.cart[itemId] < 0) this.cart[itemId] = 0;
            },
            submitOrder() {
                if (this.totalCount === 0) {
                    this.$message.warning("请先选择菜品");
                    return;
                }
                this.addOrder = Object.keys(this.cart).map(id => ({menuId: id, count: this.cart[id]}));
                axios.post('/order/add', this.addOrder, {
                    headers: {
                        'Authorization': sessionStorage.getItem("token")
                    }
                }).then(res => {
                    if (res.data.code === 200) {
                        this.cart = {}
                        this.addOrder = {}
                    } else {
                        this.$message.error(res.data.message)
                    }
                }).catch(err => {
                    this.$message.error(err.response?.data?.message || '加载菜单失败');
                });
            },
            loadOrderList() {
                this.activeTab = 'orders'
                axios.get('/order/list', {
                    headers: {
                        'Authorization': sessionStorage.getItem("token")
                    }
                }).then(res => {
                    console.log(res.data)
                    if (res.data.code === 200) {
                        this.orderList = res.data.data
                    } else {
                        this.$message.error(res.data.message)
                    }
                }).catch(err => {
                    this.$message.error(err.response?.data?.message || '加载订单失败');
                });
            },
            formatTime(time) {
                return time ? time.replace('T', ' ') : '';
            }

        }
    });
</script>

<style>
    body {
        margin: 0;
        background: #f2f3f5;
    }

    .header {
        height: 50px;
        background: #409eff;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 14px;
    }

    .category div {
        padding: 12px 16px;
        white-space: nowrap;
        cursor: pointer;
    }

    .menu-list {
        padding: 10px;
        padding-bottom: 90px;
    }

    .menu-card {
        background: #fff;
        border-radius: 8px;
        margin-bottom: 12px;
        overflow: hidden;
        padding: 10px;
    }

    .menu-row {
        display: flex;
        align-items: flex-start;
    }

    .food-img {
        width: 100px;
        height: 100px;
        object-fit: cover;
        border-radius: 8px;
        margin-right: 12px;
    }

    .menu-info {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        position: relative; /* 保证按钮在可点击层 */
    }

    .food-name {
        font-weight: bold;
        font-size: 16px;
        margin-bottom: 6px;
    }

    .food-intro {
        color: #666;
        font-size: 13px;
        margin-bottom: 10px;
    }

    .menu-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .count button {
        width: 36px;
        height: 36px;
        font-size: 18px;
        border-radius: 50%;
        border: none;
        background: #409eff;
        color: #fff;
    }

    .count span {
        display: inline-block;
        width: 30px;
        text-align: center;
    }

    /* 底部容器 */
    .bottom-bar {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        height: 60px;
        background: #fff;
        border-top: 1px solid #ebeef5;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 10px;
        z-index: 100;
    }

    /* tab 栏 */
    .tab-bar {
        display: flex;
        align-items: center;
        height: 100%;
    }

    .tab-item {
        padding: 0 12px;
        line-height: 60px;
        cursor: pointer;
        color: #666;
    }

    .tab-item.active {
        color: #409eff;
        font-weight: bold;
        border-bottom: 2px solid #409eff;
    }

    /* 中间购物信息 */
    .cart-info {
        font-size: 14px;
    }

    /* 右侧结算按钮 */
    .submit-btn {
        height: 40px;
    }

    .order-page {
        padding: 12px;
        padding-bottom: 80px;
        background: #f6f6f6;
    }

    .order-card {
        background: #fff;
        border-radius: 10px;
        padding: 12px;
        margin-bottom: 12px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
    }

    .order-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
    }

    .menu-name {
        font-size: 16px;
        font-weight: 600;
        color: #333;
    }

    .menu-count {
        font-size: 14px;
        color: #ff4d4f;
    }

    .order-body {
        font-size: 13px;
        color: #666;
    }

    .order-row {
        display: flex;
        justify-content: space-between;
        margin-top: 4px;
    }

    .order-row .label {
        color: #999;
    }

    .empty {
        text-align: center;
        color: #999;
        margin-top: 60px;
        font-size: 14px;
    }

    .menu-search {
        display: flex;
        align-items: center;
        margin-bottom: 15px;
    }

    .search-input {
        width: 260px;
    }

    /* 输入框整体 */
    .search-input .el-input__inner {
        border-radius: 20px;
        height: 36px;
        padding-left: 36px;
        transition: all 0.3s ease;
        border: 1px solid #dcdfe6;
    }

    /* 聚焦效果 */
    .search-input .el-input__inner:focus {
        border-color: #409EFF;
        box-shadow: 0 0 6px rgba(64, 158, 255, 0.4);
    }

    /* 搜索图标 */
    .search-input .el-input__prefix {
        left: 10px;
        color: #909399;
    }

    /* 清空按钮 */
    .search-input .el-input__suffix {
        right: 10px;
    }


</style>
</body>
</html>
