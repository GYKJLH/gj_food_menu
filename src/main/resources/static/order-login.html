<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <title>点餐系统 - 登录 / 注册</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">

    <style>
        body {
            background: linear-gradient(135deg, #fdfbfb, #ebedee);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            font-family: "Microsoft YaHei", sans-serif;
        }

        .login-container {
            width: 380px;
            padding: 36px 36px 24px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.12);
        }

        .login-title {
            text-align: center;
            font-size: 22px;
            margin-bottom: 24px;
            color: #333;
            font-weight: bold;
        }

        .switch {
            text-align: center;
            margin-bottom: 20px;
        }

        .login-footer {
            text-align: center;
            margin-top: 16px;
            color: #999;
            font-size: 13px;
        }
    </style>
</head>
<body>

<div id="app">
    <div class="login-container">
        <div class="login-title">
            下单系统
        </div>

        <!-- 登录 / 注册切换 -->
        <div class="switch">
            <el-radio-group v-model="mode" size="small">
                <el-radio-button label="login">登录</el-radio-button>
                <el-radio-button label="register">注册</el-radio-button>
            </el-radio-group>
        </div>

        <!-- 表单 -->
        <el-form :model="form" :rules="rules" ref="form" label-width="0">

            <el-form-item prop="username">
                <el-input
                        v-model="form.username"
                        prefix-icon="el-icon-user"
                        placeholder="请输入用户名">
                </el-input>
            </el-form-item>

            <el-form-item prop="password">
                <el-input
                        v-model="form.password"
                        type="password"
                        prefix-icon="el-icon-lock"
                        placeholder="请输入密码">
                </el-input>
            </el-form-item>

            <!-- 注册时多两个输入框 -->
            <el-form-item v-if="mode === 'register'" prop="confirmPassword">
                <el-input
                        v-model="form.confirmPassword"
                        type="password"
                        prefix-icon="el-icon-lock"
                        placeholder="请再次输入密码">
                </el-input>
            </el-form-item>

            <el-form-item v-if="mode === 'register'" prop="phone">
                <el-input
                        v-model="form.phone"
                        prefix-icon="el-icon-phone"
                        placeholder="请输入手机号">
                </el-input>
            </el-form-item>

            <el-form-item>
                <el-button
                        type="primary"
                        style="width: 100%"
                        @click="submit">
                    {{ mode === 'login' ? '登录' : '注册' }}
                </el-button>
            </el-form-item>

        </el-form>

        <div class="login-footer">
            果酱夫妇的餐饮小铺
        </div>
    </div>
</div>

<script src="https://unpkg.com/vue@2/dist/vue.js"></script>
<script src="https://unpkg.com/element-ui/lib/index.js"></script>
<script src="https://unpkg.com/axios/dist/axios.min.js"></script>

<script>
    new Vue({
        el: "#app",

        data() {
            return {
                mode: "login", // login | register
                form: {
                    username: "",
                    password: "",
                    confirmPassword: "",
                    phone: ""
                },
                rules: {
                    username: [
                        {required: true, message: "请输入用户名", trigger: "blur"}
                    ],
                    password: [
                        {required: true, message: "请输入密码", trigger: "blur"},
                        {
                            validator: (rule, value, callback) => {
                                if (!value) {
                                    callback(new Error("请输入密码"));
                                } else if (!/^[A-Za-z0-9]{8,16}$/.test(value)) {
                                    callback(new Error("密码需为 8-16 位，仅包含字母和数字"));
                                } else {
                                    callback();
                                }
                            },
                            trigger: "blur"
                        }
                    ],
                    confirmPassword: [
                        {
                            validator: (rule, value, callback) => {
                                if (!value) {
                                    callback(new Error("请确认密码"));
                                } else if (value !== this.form.password) {
                                    callback(new Error("两次密码不一致"));
                                } else {
                                    callback();
                                }
                            },
                            trigger: "blur"
                        }
                    ],
                    phone: [
                        {required: true, message: "请输入手机号", trigger: "blur"},
                        {
                            validator: (rule, value, callback) => {
                                if (!value) {
                                    callback(new Error("请输入手机号"));
                                } else if (!/^1[3-9]\d{9}$/.test(value)) {
                                    callback(new Error("手机号格式不正确"));
                                } else {
                                    callback();
                                }
                            },
                            trigger: "blur"
                        }
                    ]
                }
            };
        },

        methods: {
            submit() {
                this.$refs.form.validate(async valid => {
                    if (!valid) return;

                    try {
                        if (this.mode === "login") {
                            await this.login();
                        } else {
                            await this.register();
                        }
                    } catch (e) {
                        this.$message.error(e.response?.data?.message || "操作失败");
                    }
                });
            },

            async login() {
                await axios.post("/order/noToken/login", this.form)
                    .then(res => {
                        if (res.data.code === 200) {
                            this.$message.success(res.data.message);
                            sessionStorage.setItem("token", res.data.data);
                            // 跳转点餐页面
                            window.location.href = "/order-mobile.html";
                        } else {
                            this.$message.error(res.data.message)
                        }
                    }).catch(err => {
                        this.$message.error(err)
                    })

            },

            async register() {
                await axios.post("/order/noToken/register", this.form)
                    .then(res => {
                        if (res.data.code === 200) {
                            this.$message.success(res.data);
                            this.mode = "login";
                            this.form.password = "";
                            this.form.confirmPassword = "";
                            this.form.phone = "";
                        } else {
                            this.$message.error(res.data.message);
                        }
                    }).catch(err => {
                        this.$message.error(err);
                    })
            }
        }
    });
</script>

</body>
</html>
